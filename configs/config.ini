[wechat_pay]
; ===== 微信支付 APIv3 配置（国内版本）=====
; 获取路径：微信支付商户平台 https://pay.weixin.qq.com
;   · 商户号 / API 证书 / APIv3 密钥：账户中心 → API 安全
;   · AppID：微信开放平台 https://open.weixin.qq.com 「移动应用」详情页
;     且必须在商户平台「产品中心 → AppID 账号管理」中完成绑定，否则下单报 APPID_MCHID_NOT_MATCH

; 是否启用微信支付。
;   true  = 真实链路，所有参数必须完整配置，否则启动日志报错且支付接口返回 503
;   false = 微信支付功能整体关闭（**无 mock / 模拟降级**，客户端会员页应隐藏入口）
; 接入真实环境测试请置为 true 并补全下列全部参数。
enable=true

; 移动应用 AppID（微信开放平台创建的「移动应用」所得，以 wx 开头）
app_id=wx26395d47b04e11b5
; 商户号 MchID（商户平台顶部展示的 10 位数字）
mch_id=1750755680
; 商户 APIv3 密钥：必须**恰好 32 字节**随机字符串，由商户平台自行设置
api_v3_key=t6N9xP2mQ5wK8bV4cD7sF1hG3jL0mR9e
; 商户 API 证书序列号：从 apiclient_cert.pem 或商户平台「API 证书」页获取
mch_cert_serial=5D8C5ADDDE6CEC27D2E25412C0D5B3A647EC7B53
; 商户 API 私钥文件（apiclient_key.pem，PKCS#1 或 PKCS#8 皆可）
; 部署机（/home/testuser/...）上的绝对路径；本地 macOS 调试需改为本机对应路径。
mch_key_path=/home/testuser/workspace/flutter-webrtc-server/configs/certs/apiclient_key.pem

; ===== 微信支付公钥（新商户必填）：用于回调验签 =====
; 2024 年后微信支付对新商户号不再下发「平台证书」，
; GET /v3/certificates 会返回 404 RESOURCE_NOT_EXISTS，回调验签必须改用公钥模式。
; 获取：商户平台 → 账户中心 → API 安全 → 「微信支付公钥」→ 申请并下载 pub_key.pem
; 配置后即走公钥验签，不再请求 /v3/certificates；留空则回落平台证书模式（仅老商户可用）。
; 注意：这与上面的 mch_key_path 是**两把不同的钥匙**，缺一不可。
public_key_path=/home/testuser/workspace/flutter-webrtc-server/configs/certs/pub_key.pem
; 微信支付公钥ID（形如 PUB_KEY_ID_...），商户平台公钥页面展示。
; 用于校验回调头 Wechatpay-Serial 是否匹配（忽略大小写）；留空则不校验。
public_key_id=PUB_KEY_ID_0117507556802026100800181761000806
; 异步回调公网可访问 HTTPS 地址；必须外网可达且为 https
; 微信服务器会 POST 到这里，需开放防火墙，且不能挂鉴权中间件
notify_url=https://rephone.top/api/payment/wechat/notify

; ===== 服务端统一定价（单位：分）=====
; 客户端永远不传金额，改价只改这里并重启服务；客户端会员页会通过
; GET /api/payment/products 拉取展示，无需发版。
; 留空或 <=0 时回落到默认值（299 / 2399）。
price_monthly_fen=299
price_yearly_fen=2399