[payment]
; Google Play 服务账号 JSON 文件路径（绝对路径或相对路径）
service_account=configs/google-play-service-account.json
; Android 应用包名
package_name=com.rephone.security

[wechat_pay]
; 微信支付 APIv3 配置。生产环境建议全部填充；
; 开发联调时 enable=false 即可跳过真实微信调用，走 dev mock 模式。
enable=false
; 移动应用 AppID（微信开放平台创建的「移动应用」所得，以 wx 开头）
app_id=wx_your_app_id
; 商户号 MchID（商户平台顶部展示的 10 位数字）
mch_id=1600000000
; 商户 APIv3 密钥：32 字节随机字符串，由商户平台自行设置
api_v3_key=your_32byte_apiv3_key_please_change_me
; 商户 API 证书序列号：从 apiclient_cert.pem 或商户平台获取
mch_cert_serial=YOUR_MCH_CERT_SERIAL_NUMBER
; 商户 API 私钥文件（apiclient_key.pem，PKCS#1 或 PKCS#8 皆可）
mch_key_path=configs/certs/apiclient_key.pem
; 异步回调公网可访问 HTTPS 地址；正式上线后必须改为真实域名
notify_url=https://rephone.top/api/payment/wechat/notify